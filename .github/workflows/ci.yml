name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, format, build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Smoke test the production server
        run: |
          NODE_ENV=production PORT=3000 node dist/server.cjs &
          SERVER_PID=$!
          for _ in $(seq 1 30); do
            curl -sf http://localhost:3000/api/health >/dev/null && break
            sleep 1
          done
          curl -sf http://localhost:3000/api/health
          curl -sf -o /dev/null http://localhost:3000/
          kill $SERVER_PID
